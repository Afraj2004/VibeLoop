# Coturn Server Configuration for VibeLoop
listening-port=3478
tls-listening-port=5349

# Realm and Secret (Must match process.env.TURN_SECRET in signaling server)
realm=turn.vibeloop.app
use-auth-secret
static-auth-secret=vibeloop_development_turn_secret_2025

# Relay range
min-port=49152
max-port=65535

# Fingerprint & Security Options
fingerprint
lt-cred-mech
stale-nonce=600

# Logging Options
log-file=/var/log/turnserver/turn.log
verbose
no-[# Loopback and Private IPs (Security hardening)
no-loopback-peers
no-multicast-peers