# Coturn Server Configuration for VibeLoop
#
# The shared secret is NOT stored in this file. Pass it at launch so it matches
# the signaling server's TURN_SECRET environment variable, e.g.:
#   turnserver -c /etc/turnserver.conf --static-auth-secret="$TURN_SECRET" --external-ip="$PUBLIC_IP"

listening-port=3478
tls-listening-port=5349

# Realm and time-limited credentials (TURN REST API, HMAC-SHA1 of "expiry:userId")
realm=turn.vibeloop.app
use-auth-secret

# Relay range (open these UDP ports in the firewall)
min-port=49152
max-port=65535

# TLS certificates for turns:// on 5349 (uncomment once issued)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Fingerprint & Security Options
fingerprint
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers

# Never relay into private, link-local or cloud-metadata networks (prevents SSRF through the relay)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits
total-quota=1200
user-quota=12
max-bps=3000000

# Logging Options (stdout for containers)
log-file=stdout
